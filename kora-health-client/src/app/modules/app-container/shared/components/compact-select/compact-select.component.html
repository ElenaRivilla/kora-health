<select class="compact-select__control" [attr.aria-label]="label()" (change)="select($event)">
  @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
  }
</select>
<ng-icon class="compact-select__icon" name="phosphorCaretDown" />
