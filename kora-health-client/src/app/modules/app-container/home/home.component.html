<header class="home__header">
  <!-- Reserved for a future back button; empty and without width for now. -->
  <div class="home__leading"></div>
  <h1 class="home__title">{{ title() }}</h1>
</header>

<nav class="home__nav" aria-label="Secciones">
  <ul class="home__nav-list">
    @for (destination of destinations; track destination.path) {
      <li class="home__nav-item">
        <a
          class="home__nav-link"
          [routerLink]="destination.path"
          routerLinkActive="home__nav-link--active"
          ariaCurrentWhenActive="page"
        >
          <!-- Both icons are always rendered; CSS shows the fill one only on the active destination. -->
          <ng-icon class="home__icon home__icon--outline" [name]="destination.icon" />
          <ng-icon class="home__icon home__icon--fill" [name]="destination.activeIcon" />
          <span class="home__nav-label">{{ destination.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>

<main class="home__content">
  <router-outlet />
</main>
