@if (state.goalError(); as error) {
  <app-status-message kind="error">Error: {{ error }}</app-status-message>
} @else if (state.goalLoading()) {
  <app-status-message kind="loading">Cargando…</app-status-message>
} @else if (state.goal(); as goal) {
  <p class="water-goal__current">Objetivo actual: {{ goal.dailyGoalMl }} ml</p>
} @else {
  <p class="water-goal__current">Sin objetivo configurado todavía</p>
}

<form class="water-goal__form" (submit)="save($event, goalInput)">
  <app-field class="water-goal__field" label="Nuevo objetivo (ml)">
    <input
      #goalInput
      appInput
      id="water-goal-input"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
    />
  </app-field>
  <button appButton type="submit">Guardar objetivo</button>
</form>
