@if (state.goalError(); as error) {
  <p class="water-goal__status water-goal__status--error" role="alert">Error: {{ error }}</p>
} @else if (state.goalLoading()) {
  <p class="water-goal__status" role="status">Cargando…</p>
} @else if (state.goal(); as goal) {
  <p class="water-goal__current">Objetivo actual: {{ goal.dailyGoalMl }} ml</p>
} @else {
  <p class="water-goal__current">Sin objetivo configurado todavía</p>
}

<form class="water-goal__form" (submit)="save($event, goalInput)">
  <label class="water-goal__label" for="water-goal-input">Nuevo objetivo (ml)</label>
  <input
    #goalInput
    id="water-goal-input"
    class="water-goal__input"
    type="number"
    inputmode="numeric"
    min="1"
    step="1"
  />
  <button class="button" type="submit">Guardar objetivo</button>
</form>
